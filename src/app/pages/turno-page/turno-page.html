<div class="turno-card">
  <app-step-indicator [currentStep]="pasoActual()" />

  @if (cargando()) {
    <div class="spinner-container">
      <div class="loader"></div>
      <p>Procesando tu reserva...</p>
    </div>
  }

  @if (!cargando()) {
    <div class="step-content">
      @if (pasoActual() === 1) {
        <app-servicio-selector (onSelect)="handleServicioSelected($event)" />
      }
      @if (pasoActual() === 2) {
        <app-calendario-horario (onSelect)="handleFechaHoraSelected($event)" />
        <div class="nav-footer">
          <button class="btn-back" (click)="volver()">← Volver a servicios</button>
        </div>
      }
      @if (pasoActual() === 3) {
        <app-contacto-form (onConfirm)="handleFinalConfirm($event)" />
        <div class="mini-summary">
          <p>
            Resumen: <strong>{{ datosTurno().servicio?.nombre }}</strong>
            el {{ datosTurno().fecha }} a las {{ datosTurno().hora }}hs
          </p>
          <button class="btn-back" (click)="volver()">← Cambiar fecha</button>
        </div>
      }
      @if (pasoActual() === 4) {
        <app-success-view [info]="datosTurno()" />
      }
    </div>
  }
</div>
