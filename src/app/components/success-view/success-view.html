<div class="success-card">
  <div class="icon-circle">
    <span class="check">✓</span>
  </div>
  
  <h1>¡Turno Confirmado!</h1>
  <p class="main-msg">Tu reserva en la peluquería se realizó con éxito.</p>

  <div class="details-box">
    <div class="detail-item">
      <span>Servicio:</span>
      <strong>{{ info().servicio?.nombre }}</strong>
    </div>
    <div class="detail-item">
      <span>Fecha:</span>
      <strong>{{ info().fecha }}</strong>
    </div>
    <div class="detail-item">
      <span>Hora:</span>
      <strong>{{ info().hora }}hs</strong>
    </div>
  </div>

  <button class="btn-new" (click)="reiniciar()">Solicitar otro turno</button>
</div>
